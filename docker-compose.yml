services:
  backend:
    build: ./server
    ports:
      - '5001:5001'
    volumes:
      - ./server:/backend
      - /backend/node_modules
    env_file:
      - ./server/.env
    environment:
      AI_SERVICE_URL: http://microservice:8000
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongo:27017/luxeai}
    depends_on:
      mongo:
        condition: service_healthy
      microservice:
        condition: service_started
    container_name: luxeai-back
  frontend:
    build: ./client
    ports:
      - '5173:5173'
    volumes:
      - ./client/src:/frontend/src
    env_file:
      - ./client/.env
    container_name: luxeai-front
    stdin_open: true
    tty: true
    depends_on:
      - backend
  microservice:
    build: ./ai-service
    ports:
      - '8000:8000'
    container_name: luxeai-microservice
    volumes:
      - ./ai-service/src:/app/src
    command: fastapi dev src/main.py --host 0.0.0.0
  mongo:
    image: mongo:8
    container_name: luxeai-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
